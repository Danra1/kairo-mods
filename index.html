<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAIRO Mods — BeamNG.drive Mods</title>
    <meta name="description" content="KAIRO Mods — BeamNG.drive cars, maps and modifications.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <a href="/" class="logo">
        KAIRO<span>MODS</span>
    </a>

    <nav class="main-nav">

        <a href="/#mods">
            Mods
        </a>

        <a href="/#cars">
            Cars
        </a>

        <a href="/#maps">
            Maps
        </a>

        <a href="/#parts">
            Parts
        </a>

    </nav>

    <div class="header-actions">

        <a href="/#mods" class="submit-btn">
            EXPLORE MODS
        </a>

        <a href="/submit/" class="submit-outline">
            SUBMIT MOD
        </a>

    </div>

</header>


<main>

<section class="hero">

    <div class="hero-content">

        <div class="badge">
            BEAMNG.DRIVE MOD DATABASE
        </div>

        <h1>
            DRIVE<br>
            <span>DIFFERENT.</span>
        </h1>

        <p>
            Discover unique cars, maps and modifications
            for BeamNG.drive.
        </p>

        <div class="search-box">
            <input
                id="search"
                type="text"
                placeholder="Search mods..."
            >

            <button onclick="searchMods()">
                SEARCH
            </button>
        </div>

    </div>

</section>


<section class="mods-section" id="mods">

    <div class="section-title">

        <div>
            <small>EXPLORE</small>
            <h2>Latest Mods</h2>
        </div>

       <div class="filter">

    <button
        class="active"
        onclick="filterMods('all', this)"
    >
        All
    </button>

    <button
        onclick="filterMods('cars', this)"
    >
        Cars
    </button>

    <button
        onclick="filterMods('maps', this)"
    >
        Maps
    </button>

    <button
        onclick="filterMods('parts', this)"
    >
        Parts
    </button>

</div>
        </div>

    </div>


    <div class="mods-grid" id="modsGrid"></div>

</section>

</main>


<footer>

    <div class="logo">
        KAIRO<span>MODS</span>
    </div>

    <p>
        © 2026 KAIRO Mods. BeamNG.drive mod database.
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
